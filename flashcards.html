<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard</title>
    <link rel="stylesheet" href="assets/style.css">
    <base href="/foreign-language/">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <h1 class="title"><i class="fa-solid fa-layer-group"></i> Flashcards</h1>
    <p>Chọn chủ đề bạn muốn học từ mới</p>
    <div class="menu" id="flashcardMenu"></div>

    <script>
        async function loadStories() {
            try {
                const response = await fetch("assets/data/flashcards/index.json");

                if (!response.ok) {
                    throw new Error("Cannot load JSON file");
                }

                const data = await response.json();
                renderStories(data);

            } catch (error) {
                console.error(error);
                showError("Cannot load story");
            }
        }

        function renderStories(stories) {
            const menu = document.getElementById("flashcardMenu");

            menu.innerHTML = stories.map(story => `
                <a 
                    href="flashcard.html?topic=${encodeURIComponent(story.slug)}&title=${encodeURIComponent(story.title)}" 
                    class="btn"
                >
                    <i class="fas fa-book"></i> ${story.title}
                </a>
            `).join("");
        }

        function showError(message) {
            document.getElementById("flashcardMenu").innerHTML = `
                <p style="color: red;">${message}</p>
            `;
        }

        loadStories();
    </script>
</body>

</html>
