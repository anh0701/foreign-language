<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word combination</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/word-combination.css">
    <script src="assets/script.js" defer></script>
    <base href="/foreign-language/">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="wrapper">
        <main class="content">
            <h1 class="title"><i class="fa-solid fa-bullseye"></i> Ghép chữ cái thành từ</h1>
            <div class="combination">
                <p id="meaning"></p>
                <div id="answer"></div>
                <div id="letters"></div>
                <p id="result"></p>
            </div>
        </main>
        <footer class="footer">
            <button onclick="goHome()" class="btn"><i class="fa-solid fa-house"></i> Home</button>
            <button id="next" class="btn"><i class="fa-solid fa-rotate"></i> Từ khác</button>
        </footer>
    </div>


    <div id="loader"
        style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;">
        <div class="spinner"></div>
    </div>

    <script src="assets/word-combination.js" defer></script>
</body>

</html>
