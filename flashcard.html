<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/flashcard.css">
    <script src="assets/script.js"></script>
    <base href="/foreign-language/">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="wrapper">
        <main class="content">
            <h1 class="title" id="topic-title"><i class="fa-solid fa-layer-group"></i> Loading...</h1>
            <div class="container">
                <article class="flashcard">
                    <div class="card">
                        <div class="front"></div>
                        <div class="back"></div>
                    </div>
                </article>
            </div>
        </main>
        <footer class="footer">
            <button id="prev" class="btn">Back</button>
            <!-- <button id="flip">Flip</button> -->
            <button onclick="goHome()" class="btn"><i class="fa-solid fa-house"></i> Home</button>
            <button id="next" class="btn">Next</button>
        </footer>
    </div>
    <div id="loader"
        style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;">
        <div class="spinner"></div>
    </div>
    <script src="assets/flashcard.js"></script>
</body>

</html>
